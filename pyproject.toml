[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signverse-ai"
version = "0.1.0"
description = "Isolated gesture recognition with MediaPipe and a PyTorch BiLSTM"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
include = ["signverse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
